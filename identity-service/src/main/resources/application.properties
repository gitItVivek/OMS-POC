spring.application.name=identity-service
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/identity-service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

oms.jwt.secret=oms-poc-jwt-secret-key-min-32-chars-long!!
oms.jwt.expiry-seconds=3600
oms.jwt.token-type=Bearer

oms.security.bcrypt-strength=10
oms.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
