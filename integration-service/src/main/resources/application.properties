spring.application.name=integration-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/integration-service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

identity.service.base-url=http://127.0.0.1:8086
notification.service.base-url=http://127.0.0.1:8083
order.service.base-url=http://127.0.0.1:8081
inventory.service.base-url=http://127.0.0.1:8084
fulfillment.service.base-url=http://127.0.0.1:8082

spring.kafka.bootstrap-servers=localhost:9092

camel.component.kafka.brokers=localhost:9092
camel.component.kafka.group-id=integration-saga

# Both thin Camel (OrderSagaRoutes) and Spring Integration (OrderSagaIntegrationFlows)
# Kafka listeners are always active. The HTTP path selects ownership:
#   POST /api/bench/place-order/saga                → event_adapter=CAMEL
#   POST /api/bench/place-order/spring-integration → event_adapter=SPRING_INTEGRATION
#   POST /api/bench/place-order/camel              → Camel-heavy on oms.camel.* (separate)
# Orchestrator ignores events when the listener's adapter does not match the saga row.
