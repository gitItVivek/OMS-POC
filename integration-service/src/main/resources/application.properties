spring.application.name=integration-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/integration-service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema: Flyway creates tables; Hibernate must not touch schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns integration-service schema — set enabled=false after first successful run.
spring.flyway.enabled=true

order.service.base-url=http://localhost:8081
inventory.service.base-url=http://localhost:8084
fulfillment.service.base-url=http://localhost:8082
notification.service.base-url=http://localhost:8083

