spring.application.name=inventory-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/oms-poc
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema: Flyway creates tables; Hibernate must not touch schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway owns oms-poc schema — set enabled=false after first successful run.
spring.flyway.enabled=true

inventory.product-load.enabled=true
inventory.product-load.file-path=docs/ikea_sample_file.json
