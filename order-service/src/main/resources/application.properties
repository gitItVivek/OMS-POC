spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/oms-poc
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

inventory.service.base-url=http://localhost:8084
identity.service.base-url=http://localhost:8086

oms.jwt.secret=oms-poc-jwt-secret-key-min-32-chars-long!!
oms.jwt.expiry-seconds=3600

oms.experience.search.max-interests-per-search=10
oms.experience.dashboard.product-limit=10
oms.experience.dashboard.history-lookback=50
oms.experience.dashboard.category-lookback=5
