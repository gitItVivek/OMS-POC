spring.application.name=docs-agent-service

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o-mini}

# MCP Streamable-HTTP (Cursor / HTTP clients). Tools also registered via ToolCallbacks.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=oms-docs-agent
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.tool-callback-converter=true

docs.agent.repo-root=${DOCS_AGENT_REPO_ROOT:.}
docs.agent.output-dir=docs/api
docs.agent.services=identity-service,order-service,inventory-service,fulfillment-service,notification-service,integration-service
docs.agent.run-on-startup=false
docs.agent.exit-after-run=true

server.port=${SERVER_PORT:8099}
