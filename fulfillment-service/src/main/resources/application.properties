spring.application.name=fulfillment-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/oms-poc
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

fulfillment.default-carrier=OMS-Express
fulfillment.tracking-number-prefix=TRK-
fulfillment.tracking-number-min=100000000
fulfillment.tracking-number-max=999999999

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
