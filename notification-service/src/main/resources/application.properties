spring.application.name=notification-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/oms-poc
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema created by inventory-service Flyway migration (V1__create_oms_poc_schema.sql).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=localhost:9092

oms.notification.search-interest.max-emails=2
oms.notification.search-interest.window-hours=72
